<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Scan2PDF</title>
<style>
:root{--blue:#1a73e8;--blue-d:#1558b0;--bg:#f4f6fa;--card:#fff;--text:#1d2433;--muted:#6b7385;--line:#e3e7ef;--danger:#d93025}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overscroll-behavior:none}
button{font:inherit;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

header{background:var(--blue);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
#count{font-size:13px;opacity:.85;flex:1}
.hbtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:18px;padding:7px 14px;font-size:13px;font-weight:600}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px 14px calc(120px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(20,30,60,.1)}
.thumb{position:relative;aspect-ratio:3/4;background:#e6eaf1;display:flex;align-items:center;justify-content:center}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.num{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 7px}
.acts{display:flex;border-top:1px solid var(--line)}
.acts button{flex:1;background:none;border:0;padding:10px 0;color:var(--text);display:flex;justify-content:center}
.acts button svg{width:19px;height:19px}
.acts button:disabled{opacity:.25}
.acts button.danger{color:var(--danger)}

#empty{text-align:center;color:var(--muted);padding:70px 30px 0}
#empty .big{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;background:#e3ecfb;color:var(--blue);display:flex;align-items:center;justify-content:center}
#empty .big svg{width:44px;height:44px}
#empty h2{color:var(--text);margin:0 0 8px;font-size:20px}
#empty p{margin:0;line-height:1.5;font-size:15px}

#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:10}
.bbtn{background:none;border:0;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;width:86px;padding:6px 0}
.bbtn:disabled{opacity:.35}
.fab{width:68px;height:68px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-30px;box-shadow:0 4px 14px rgba(26,115,232,.45)}
.fab:active{background:var(--blue-d)}
.fab svg{width:30px;height:30px}

/* editor */
#editor{position:fixed;inset:0;background:#0f1115;color:#fff;display:none;flex-direction:column;z-index:30}
#editor.open{display:flex}
.ed-top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.ed-top button{background:none;border:0;color:#fff;font-size:16px;padding:10px 12px;border-radius:10px}
.ed-top .done{background:var(--blue);font-weight:700;padding:9px 20px}
.ed-top .reset{font-size:14px;color:#aeb4c2}
#stage{flex:1;position:relative;min-height:0}
#edCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ed-tools{display:flex;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#181b21}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:#aeb4c2;font-size:11px;padding:8px 0;border-radius:10px}
.tool.active{color:#fff;background:#2a3040}
.sep{width:1px;background:#2a3040;margin:6px 3px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
.overlay.open{display:flex}
.panel{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.panel h2{margin:0 0 14px;font-size:19px}
.panel label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px}
.panel input,.panel select{display:block;width:100%;margin-top:5px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--text)}
.row{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:#eef1f6;color:var(--text)}
#result{background:#e9f6ee;border-radius:12px;padding:12px;margin:2px 0 12px;color:#14602c;font-size:14px;font-weight:600}
#result .row{margin-top:10px}
#result .btn{padding:11px;font-size:15px}

#busy{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff;z-index:60;font-size:15px}
#busy.open{display:flex}
.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:70;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>Scan2PDF</h1>
  <span id="count"></span>
  <button class="hbtn" id="btnInstall" hidden>Install</button>
  <button class="hbtn" id="btnClear" hidden>Clear</button>
</header>

<main>
  <div id="empty">
    <div class="big"><span data-i="doc"></span></div>
    <h2>No pages yet</h2>
    <p>Tap the camera button to scan a document, or pick photos from your gallery.</p>
  </div>
  <div id="grid"></div>
</main>

<nav id="bar">
  <button class="bbtn" id="btnGallery"><span data-i="image"></span>Gallery</button>
  <button class="fab" id="btnCamera" aria-label="Scan with camera"><span data-i="camera"></span></button>
  <button class="bbtn" id="btnPdf" disabled><span data-i="pdf"></span>Save PDF</button>
</nav>

<input type="file" id="inCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="inGallery" accept="image/*" multiple hidden>

<section id="editor">
  <div class="ed-top">
    <button id="edCancel">Cancel</button>
    <button class="reset" id="edReset">Reset crop</button>
    <button class="done" id="edDone">Done</button>
  </div>
  <div id="stage"><canvas id="edCanvas"></canvas></div>
  <div class="ed-tools">
    <button class="tool" data-tool="crop"><span data-i="crop"></span>Crop</button>
    <button class="tool" data-tool="rotate"><span data-i="rotate"></span>Rotate</button>
    <div class="sep"></div>
    <button class="tool" data-filter="original"><span data-i="image"></span>Original</button>
    <button class="tool" data-filter="magic"><span data-i="magic"></span>Magic</button>
    <button class="tool" data-filter="gray"><span data-i="gray"></span>Gray</button>
    <button class="tool" data-filter="bw"><span data-i="bw"></span>B&amp;W</button>
  </div>
</section>

<div class="overlay" id="sheet">
  <div class="panel">
    <h2>Create PDF</h2>
    <label>File name<input id="pdfName" autocomplete="off"></label>
    <label>Page size
      <select id="pdfSize"><option value="a4">A4 (recommended)</option><option value="fit">Fit to image</option></select>
    </label>
    <label>Quality
      <select id="pdfQual"><option value="std">Standard (smaller file)</option><option value="high">High quality</option></select>
    </label>
    <div id="result" hidden>
      <div id="resultText"></div>
      <div class="row">
        <button class="btn primary" id="rShare" hidden>Share</button>
        <button class="btn primary" id="rDownload">Download</button>
        <button class="btn ghost" id="rOpen">Open</button>
      </div>
    </div>
    <div class="row">
      <button class="btn ghost" id="sheetClose">Close</button>
      <button class="btn primary" id="makePdf">Create PDF</button>
    </div>
  </div>
</div>

<div id="busy"><div class="spin"></div><div id="busyText">Working…</div></div>
<div id="toast"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const MAX_SRC = 2400;

/* ---------- icons ---------- */
const ICON = {
  camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  pdf:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  crop:'<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/>',
  rotate:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>',
  magic:'<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M19 17v4M17 19h4"/>',
  gray:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  bw:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 20L20 4v16z" fill="currentColor"/>',
  left:'<path d="M15 18l-6-6 6-6"/>',
  right:'<path d="M9 18l6-6-6-6"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>'
};
const svg = n => `<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = svg(el.dataset.i); el.style.display = 'contents'; });

/* ---------- helpers ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const tick = () => new Promise(r => setTimeout(r, 16));
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function busy(msg){ const b=$('#busy'); if(msg){ $('#busyText').textContent=msg; b.classList.add('open'); } else b.classList.remove('open'); }
const toBlob = (c, type='image/jpeg', q=0.9) => new Promise(r => c.toBlob(r, type, q));

/* ---------- storage (IndexedDB) so pages survive a reload ---------- */
const STORE = 'pages';
let dbp = null;
const getDB = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open('scan2pdf', 1);
  r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
}));
async function persist(p, srcChanged){
  try {
    if (srcChanged || !p.blob) p.blob = await toBlob(p.src, 'image/jpeg', 0.92);
    const db = await getDB();
    db.transaction(STORE, 'readwrite').objectStore(STORE).put({ id:p.id, blob:p.blob, crop:p.crop, filter:p.filter });
  } catch(e){ console.warn('persist failed', e); }
}
async function dbDelete(id){ try{ const db=await getDB(); db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);}catch(e){} }
async function dbClear(){ try{ const db=await getDB(); db.transaction(STORE,'readwrite').objectStore(STORE).clear();}catch(e){} }
function saveOrder(){ try{ localStorage.setItem('s2p_order', JSON.stringify(pages.map(p=>p.id))); }catch(e){} }

/* ---------- state ---------- */
let pages = [];   // {id, src:canvas, crop:{x,y,w,h}(0-1), filter, thumb, blob}

/* ---------- image processing ---------- */
const mk = fn => { const a = new Uint8ClampedArray(256); for (let i=0;i<256;i++) a[i]=fn(i); return a; };
const LUT_MAGIC = mk(v => 255*Math.pow(v/255, 1.3));
const LUT_GRAY  = mk(v => 255*Math.pow(v/255, 1.5));
const LUT_BW    = mk(v => { let t=clamp((v-135)/60,0,1); return 255*t*t*(3-2*t); });
const ci = v => v>255?255:(v<0?0:v|0);

function applyFilter(c, mode){
  if (mode === 'original') return;
  const w=c.width, h=c.height, x=c.getContext('2d');
  const img=x.getImageData(0,0,w,h), d=img.data;
  // estimate the page background by heavy blur, then divide it out (evens lighting, whitens paper)
  const sw=Math.max(2,Math.round(w/24)), sh=Math.max(2,Math.round(h/24));
  const sc=document.createElement('canvas'); sc.width=sw; sc.height=sh;
  const sx=sc.getContext('2d'); sx.imageSmoothingQuality='high'; sx.drawImage(c,0,0,sw,sh);
  const bc=document.createElement('canvas'); bc.width=w; bc.height=h;
  const bx=bc.getContext('2d',{willReadFrequently:true}); bx.imageSmoothingEnabled=true; bx.imageSmoothingQuality='high'; bx.drawImage(sc,0,0,w,h);
  const b=bx.getImageData(0,0,w,h).data;
  for (let i=0;i<d.length;i+=4){
    const bg=Math.max(40,(0.299*b[i]+0.587*b[i+1]+0.114*b[i+2])*0.94);
    const k=255/bg;
    if (mode==='magic'){
      d[i]=LUT_MAGIC[ci(d[i]*k)]; d[i+1]=LUT_MAGIC[ci(d[i+1]*k)]; d[i+2]=LUT_MAGIC[ci(d[i+2]*k)];
    } else {
      const n=ci((0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])*k);
      const v=(mode==='gray')?LUT_GRAY[n]:LUT_BW[n];
      d[i]=d[i+1]=d[i+2]=v;
    }
  }
  x.putImageData(img,0,0);
}

function renderPage(p, maxDim){
  const sw=p.src.width, sh=p.src.height;
  const cx=Math.round(p.crop.x*sw), cy=Math.round(p.crop.y*sh);
  const cw=Math.max(1,Math.round(p.crop.w*sw)), ch=Math.max(1,Math.round(p.crop.h*sh));
  const s=Math.min(1,maxDim/Math.max(cw,ch));
  const w=Math.max(1,Math.round(cw*s)), h=Math.max(1,Math.round(ch*s));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true}); x.imageSmoothingQuality='high';
  x.drawImage(p.src,cx,cy,cw,ch,0,0,w,h);
  applyFilter(c,p.filter);
  return c;
}
const makeThumb = p => renderPage(p,360).toDataURL('image/jpeg',0.7);

function rotateCanvas(src){
  const c=document.createElement('canvas'); c.width=src.height; c.height=src.width;
  const x=c.getContext('2d'); x.translate(src.height,0); x.rotate(Math.PI/2); x.drawImage(src,0,0);
  return c;
}

async function fileToCanvas(file){
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(e){
    bmp = await new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{URL.revokeObjectURL(u);res(im);}; im.onerror=rej; im.src=u; });
  }
  const w=bmp.width||bmp.naturalWidth, h=bmp.height||bmp.naturalHeight;
  const s=Math.min(1,MAX_SRC/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
  const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(bmp,0,0,c.width,c.height);
  if (bmp.close) bmp.close();
  return c;
}

/* ---------- grid ---------- */
function renderGrid(){
  $('#empty').hidden = pages.length>0;
  $('#grid').innerHTML = pages.map((p,i)=>`
    <div class="card" data-id="${p.id}">
      <div class="thumb" data-act="edit"><img src="${p.thumb}" alt="Page ${i+1}"><span class="num">${i+1}</span></div>
      <div class="acts">
        <button data-act="left" ${i===0?'disabled':''} aria-label="Move earlier">${svg('left')}</button>
        <button data-act="edit" aria-label="Edit">${svg('edit')}</button>
        <button data-act="right" ${i===pages.length-1?'disabled':''} aria-label="Move later">${svg('right')}</button>
        <button data-act="del" class="danger" aria-label="Delete">${svg('trash')}</button>
      </div>
    </div>`).join('');
  $('#count').textContent = pages.length ? `${pages.length} page${pages.length>1?'s':''}` : '';
  $('#btnPdf').disabled = !pages.length;
  $('#btnClear').hidden = !pages.length;
}

$('#grid').addEventListener('click', e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;
  const card=a.closest('.card'); const i=pages.findIndex(p=>p.id===card.dataset.id); if(i<0) return;
  const act=a.dataset.act;
  if (act==='edit') openEdit(pages[i]);
  else if (act==='left' && i>0){ [pages[i-1],pages[i]]=[pages[i],pages[i-1]]; saveOrder(); renderGrid(); }
  else if (act==='right' && i<pages.length-1){ [pages[i+1],pages[i]]=[pages[i],pages[i+1]]; saveOrder(); renderGrid(); }
  else if (act==='del'){ if(confirm('Delete this page?')){ dbDelete(pages[i].id); pages.splice(i,1); saveOrder(); renderGrid(); } }
});

$('#btnClear').onclick = () => { if(confirm('Remove all pages?')){ pages=[]; dbClear(); saveOrder(); renderGrid(); } };

/* ---------- adding images ---------- */
async function addFiles(fileList, openFirst){
  const files=[...fileList]; if(!files.length) return;
  busy('Adding…'); await tick();
  const added=[];
  for (const f of files){
    try {
      const src=await fileToCanvas(f);
      const p={ id:uid(), src, crop:{x:0,y:0,w:1,h:1}, filter:'magic' };
      p.thumb=makeThumb(p); pages.push(p); added.push(p);
      await persist(p,true);
    } catch(e){ console.error(e); }
  }
  saveOrder(); renderGrid(); busy();
  if (!added.length) toast('Could not read that image');
  else if (openFirst) openEdit(added[0]);
}
$('#btnCamera').onclick = () => $('#inCamera').click();
$('#btnGallery').onclick = () => $('#inGallery').click();
$('#inCamera').onchange = e => { addFiles(e.target.files, true); e.target.value=''; };
$('#inGallery').onchange = e => { addFiles(e.target.files, false); e.target.value=''; };

/* ---------- editor ---------- */
let ed=null, disp={ox:0,oy:0,w:1,h:1}, drag=null;
const edCanvas=$('#edCanvas');

function openEdit(p){
  ed={ p, src:p.src, crop:{...p.crop}, filter:p.filter, mode:'crop', preview:null, srcChanged:false };
  $('#editor').classList.add('open');
  requestAnimationFrame(()=>setMode('crop'));
}
function closeEdit(){ $('#editor').classList.remove('open'); ed=null; drag=null; }
function setMode(m){
  ed.mode=m;
  if (m==='preview') ed.preview=renderPage({src:ed.src,crop:ed.crop,filter:ed.filter},1400);
  document.querySelectorAll('.ed-tools [data-tool="crop"]').forEach(b=>b.classList.toggle('active',m==='crop'));
  document.querySelectorAll('.ed-tools [data-filter]').forEach(b=>b.classList.toggle('active',m==='preview'&&b.dataset.filter===ed.filter));
  $('#edReset').style.visibility = m==='crop' ? 'visible' : 'hidden';
  drawEd();
}
function drawEd(){
  if(!ed) return;
  const st=$('#stage'), W=st.clientWidth, H=st.clientHeight, dpr=window.devicePixelRatio||1;
  if(!W||!H) return;
  if (edCanvas.width!==Math.round(W*dpr)||edCanvas.height!==Math.round(H*dpr)){ edCanvas.width=Math.round(W*dpr); edCanvas.height=Math.round(H*dpr); }
  const g=edCanvas.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const img = ed.mode==='crop' ? ed.src : ed.preview;
  const pad = ed.mode==='crop' ? 22 : 12;
  const s=Math.min((W-pad*2)/img.width,(H-pad*2)/img.height);
  const dw=img.width*s, dh=img.height*s, ox=(W-dw)/2, oy=(H-dh)/2;
  disp={ox,oy,w:dw,h:dh};
  g.imageSmoothingQuality='high'; g.drawImage(img,ox,oy,dw,dh);
  if (ed.mode!=='crop') return;
  const c=ed.crop, l=ox+c.x*dw, t=oy+c.y*dh, r=l+c.w*dw, b=t+c.h*dh;
  g.fillStyle='rgba(0,0,0,.55)'; g.beginPath(); g.rect(ox,oy,dw,dh); g.rect(l,t,r-l,b-t); g.fill('evenodd');
  g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=1; g.beginPath();
  for(let i=1;i<3;i++){ g.moveTo(l+(r-l)*i/3,t); g.lineTo(l+(r-l)*i/3,b); g.moveTo(l,t+(b-t)*i/3); g.lineTo(r,t+(b-t)*i/3); }
  g.stroke();
  g.strokeStyle='#fff'; g.lineWidth=2; g.strokeRect(l,t,r-l,b-t);
  g.fillStyle='#1a73e8'; g.strokeStyle='#fff'; g.lineWidth=2;
  [[l,t],[r,t],[l,b],[r,b]].forEach(([px,py])=>{ g.beginPath(); g.arc(px,py,10,0,Math.PI*2); g.fill(); g.stroke(); });
  g.fillStyle='#fff';
  [[(l+r)/2,t,18,4],[(l+r)/2,b,18,4],[l,(t+b)/2,4,18],[r,(t+b)/2,4,18]].forEach(([px,py,bw,bh])=>g.fillRect(px-bw/2,py-bh/2,bw,bh));
}
function hit(pt){
  const c=ed.crop, {ox,oy,w,h}=disp, T=30;
  const l=ox+c.x*w, t=oy+c.y*h, r=l+c.w*w, b=t+c.h*h;
  const nl=Math.abs(pt.x-l)<T, nr=Math.abs(pt.x-r)<T, nt=Math.abs(pt.y-t)<T, nb=Math.abs(pt.y-b)<T;
  const inX=pt.x>l-T&&pt.x<r+T, inY=pt.y>t-T&&pt.y<b+T;
  if(nl&&nt)return'tl'; if(nr&&nt)return'tr'; if(nl&&nb)return'bl'; if(nr&&nb)return'br';
  if(nl&&inY)return'l'; if(nr&&inY)return'r'; if(nt&&inX)return't'; if(nb&&inX)return'b';
  if(pt.x>l&&pt.x<r&&pt.y>t&&pt.y<b)return'move';
  return null;
}
edCanvas.addEventListener('pointerdown', e=>{
  if(!ed||ed.mode!=='crop') return;
  const rc=edCanvas.getBoundingClientRect();
  const m=hit({x:e.clientX-rc.left,y:e.clientY-rc.top}); if(!m) return;
  edCanvas.setPointerCapture(e.pointerId);
  const c=ed.crop; drag={m,x:e.clientX,y:e.clientY,l:c.x,t:c.y,r:c.x+c.w,b:c.y+c.h};
});
edCanvas.addEventListener('pointermove', e=>{
  if(!drag||!ed) return;
  const dx=(e.clientX-drag.x)/disp.w, dy=(e.clientY-drag.y)/disp.h, MIN=0.08;
  let {l,t,r,b}=drag;
  if (drag.m==='move'){
    const w=r-l, h=b-t; l=clamp(l+dx,0,1-w); t=clamp(t+dy,0,1-h); r=l+w; b=t+h;
  } else {
    if(drag.m.includes('l')) l=clamp(drag.l+dx,0,r-MIN);
    if(drag.m.includes('r')) r=clamp(drag.r+dx,l+MIN,1);
    if(drag.m.includes('t')) t=clamp(drag.t+dy,0,b-MIN);
    if(drag.m.includes('b')) b=clamp(drag.b+dy,t+MIN,1);
  }
  ed.crop={x:l,y:t,w:r-l,h:b-t}; drawEd();
});
['pointerup','pointercancel'].forEach(ev=>edCanvas.addEventListener(ev,()=>{drag=null;}));

document.querySelectorAll('.ed-tools [data-tool]').forEach(b=>b.onclick=()=>{
  if(!ed) return;
  if (b.dataset.tool==='crop') setMode('crop');
  else if (b.dataset.tool==='rotate'){
    const c=ed.crop;
    ed.src=rotateCanvas(ed.src); ed.srcChanged=true;
    ed.crop={x:1-(c.y+c.h),y:c.x,w:c.h,h:c.w};
    setMode(ed.mode);
  }
});
document.querySelectorAll('.ed-tools [data-filter]').forEach(b=>b.onclick=()=>{ if(!ed) return; ed.filter=b.dataset.filter; setMode('preview'); });
$('#edReset').onclick=()=>{ if(ed){ ed.crop={x:0,y:0,w:1,h:1}; drawEd(); } };
$('#edCancel').onclick=closeEdit;
$('#edDone').onclick=async()=>{
  if(!ed) return;
  const {p,src,crop,filter,srcChanged}=ed;
  p.src=src; p.crop=crop; p.filter=filter;
  closeEdit(); busy('Applying…'); await tick();
  p.thumb=makeThumb(p); renderGrid(); busy();
  persist(p,srcChanged);
};
window.addEventListener('resize',()=>{ if(ed) drawEd(); });

/* ---------- PDF export ---------- */
// <PDF>
function buildPDF(items, size){
  const enc=new TextEncoder(); const chunks=[]; let off=0; const xref=[];
  const put=d=>{ const b=typeof d==='string'?enc.encode(d):d; chunks.push(b); off+=b.length; };
  put('%PDF-1.4\n'); put(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  const n=items.length;
  const kids=items.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  xref[1]=off; put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  xref[2]=off; put(`2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${n} >>\nendobj\n`);
  const f=v=>v.toFixed(2);
  items.forEach((it,i)=>{
    let pw,ph,dw,dh,dx,dy;
    if (size==='fit'){ pw=it.w*0.48; ph=it.h*0.48; dw=pw; dh=ph; dx=0; dy=0; }
    else {
      const land=it.w>it.h; pw=land?841.89:595.28; ph=land?595.28:841.89;
      const m=14, s=Math.min((pw-2*m)/it.w,(ph-2*m)/it.h);
      dw=it.w*s; dh=it.h*s; dx=(pw-dw)/2; dy=(ph-dh)/2;
    }
    const pn=3+i*3, cn=pn+1, im=pn+2;
    const content=`q ${f(dw)} 0 0 ${f(dh)} ${f(dx)} ${f(dy)} cm /Im0 Do Q`;
    xref[pn]=off; put(`${pn} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(pw)} ${f(ph)}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${cn} 0 R >>\nendobj\n`);
    xref[cn]=off; put(`${cn} 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
    xref[im]=off; put(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${it.w} /Height ${it.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${it.bytes.length} >>\nstream\n`);
    put(it.bytes); put('\nendstream\nendobj\n');
  });
  const total=3+n*3, xs=off;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i=1;i<total;i++) x+=String(xref[i]).padStart(10,'0')+' 00000 n \n';
  put(x); put(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xs}\n%%EOF`);
  return new Blob(chunks,{type:'application/pdf'});
}
// </PDF>

let lastFile=null, lastUrl=null;
function openSheet(){
  const d=new Date(), pad=v=>String(v).padStart(2,'0');
  $('#pdfName').value=`Scan_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  $('#result').hidden=true; $('#makePdf').textContent='Create PDF';
  $('#sheet').classList.add('open');
}
$('#btnPdf').onclick=openSheet;
$('#sheetClose').onclick=()=>$('#sheet').classList.remove('open');

$('#makePdf').onclick=async()=>{
  if(!pages.length) return;
  const name=($('#pdfName').value.trim()||'Scan').replace(/[\\/:*?"<>|]+/g,'_');
  const high=$('#pdfQual').value==='high', size=$('#pdfSize').value;
  const maxDim=high?2400:1600, q=high?0.92:0.8;
  try {
    const items=[];
    for (let i=0;i<pages.length;i++){
      busy(`Processing page ${i+1} of ${pages.length}…`); await tick();
      const c=renderPage(pages[i],maxDim);
      const blob=await toBlob(c,'image/jpeg',q);
      items.push({ bytes:new Uint8Array(await blob.arrayBuffer()), w:c.width, h:c.height });
    }
    busy('Building PDF…'); await tick();
    const pdf=buildPDF(items,size);
    lastFile=new File([pdf],name+'.pdf',{type:'application/pdf'});
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl=URL.createObjectURL(lastFile);
    const mb=lastFile.size/1048576;
    $('#resultText').textContent=`PDF ready · ${pages.length} page${pages.length>1?'s':''} · ${mb>=1?mb.toFixed(1)+' MB':Math.round(lastFile.size/1024)+' KB'}`;
    $('#rShare').hidden=!(navigator.canShare && navigator.canShare({files:[lastFile]}));
    $('#result').hidden=false; $('#makePdf').textContent='Create again';
  } catch(e){ console.error(e); toast('Something went wrong creating the PDF'); }
  busy();
};
$('#rDownload').onclick=()=>{ if(!lastFile) return; const a=document.createElement('a'); a.href=lastUrl; a.download=lastFile.name; document.body.appendChild(a); a.click(); a.remove(); };
$('#rOpen').onclick=()=>{ if(lastUrl) window.open(lastUrl,'_blank'); };
$('#rShare').onclick=async()=>{ try{ await navigator.share({files:[lastFile],title:lastFile.name}); }catch(e){} };

/* ---------- install + startup ---------- */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; $('#btnInstall').hidden=false; });
$('#btnInstall').onclick=async()=>{ if(!deferred) return; deferred.prompt(); try{await deferred.userChoice;}catch(e){} deferred=null; $('#btnInstall').hidden=true; };
window.addEventListener('appinstalled',()=>{ $('#btnInstall').hidden=true; });

async function restore(){
  const db=await getDB();
  let order=[]; try{ order=JSON.parse(localStorage.getItem('s2p_order')||'[]'); }catch(e){}
  const recs=await new Promise((res,rej)=>{ const r=db.transaction(STORE).objectStore(STORE).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const map=new Map(recs.map(r=>[r.id,r]));
  const ids=order.filter(id=>map.has(id)).concat(recs.map(r=>r.id).filter(id=>!order.includes(id)));
  for (const id of ids){
    const r=map.get(id);
    const bmp=await createImageBitmap(r.blob);
    const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
    c.getContext('2d').drawImage(bmp,0,0); if(bmp.close) bmp.close();
    const p={ id, src:c, crop:r.crop, filter:r.filter, blob:r.blob };
    p.thumb=makeThumb(p); pages.push(p);
  }
}
(async()=>{
  try{ await restore(); }catch(e){ console.warn('restore failed',e); }
  renderGrid();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
